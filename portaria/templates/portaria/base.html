<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portaria de Condomínio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Importei a fonte "Inter" do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Aplica a mesma fonte em toda a página e em todos os campos de formulário */
        body, form, input, select, textarea, button, label {
            font-family: 'Inter', sans-serif !important;
        }

        .card-body form:not(#form-aviso) {
            display: flex;
            flex-direction: column;
        }

        .card-body form:not(#form-aviso) button[type="submit"],
        form.card button[type="submit"] {
            align-self: flex-end;
            padding: 0.45rem 1.5rem;
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'index' %}">
                <i class="bi bi-building-lock me-2"></i>Portaria Condominio
            </a>
            <div class="navbar-nav me-auto">
                <a class="nav-link" href="{% url 'index' %}">Inicio</a>
                <a class="nav-link" href="{% url 'cadastro_morador' %}">Moradores</a>
                <a class="nav-link" href="{% url 'cadastro_entrega' %}">Entregas</a>
                <a class="nav-link" href="{% url 'verificacao_entradas' %}">Entradas</a>
                <a class="nav-link" href="{% url 'cadastro_funcionario' %}">Colaboradores</a>
                <a class="nav-link" href="{% url 'registro_ocorrencias' %}">Ocorrencias</a>
            </div>
            <span id="relogio-portaria" class="navbar-text text-light badge bg-secondary fs-6"></span>
        </div>
    </nav>

    <div class="container pb-5">
        {% block content %}{% endblock %}
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // 1. Relógio em tempo real na barra superior
            const relogio = document.getElementById("relogio-portaria");
            function atualizarRelogio() {
                const agora = new Date();
                relogio.textContent = agora.toLocaleDateString("pt-BR") + " " + agora.toLocaleTimeString("pt-BR");
            }
            atualizarRelogio();
            setInterval(atualizarRelogio, 1000);

            // 2. Destacar link ativo no menu
            const pathAtual = window.location.pathname;
            document.querySelectorAll(".navbar-nav .nav-link").forEach(link => {
                if (link.getAttribute("href") === pathAtual) {
                    link.classList.add("active", "fw-bold");
                }
            });

            // 3. Máscara de CPF
            const campoCpf = document.querySelector('input[name="cpf"]');
            if (campoCpf) {
                campoCpf.addEventListener("input", function (e) {
                    let v = e.target.value.replace(/\D/g, "").slice(0, 11);
                    v = v.replace(/(\d{3})(\d)/, "$1.$2");
                    v = v.replace(/(\d{3})(\d)/, "$1.$2");
                    v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
                    e.target.value = v;
                });
            }

            // 4. Máscara de telefone
            const campoTel = document.querySelector('input[name="telefone"]');
            if (campoTel) {
                campoTel.addEventListener("input", function (e) {
                    let v = e.target.value.replace(/\D/g, "").slice(0, 11);
                    v = v.replace(/^(\d{2})(\d)/g, "($1) $2");
                    v = v.replace(/(\d)(\d{4})$/, "$1-$2");
                    e.target.value = v;
                });
            }

            // 5. Limite de RG/CIN (apenas números, máximo 11 dígitos)
            const campoDoc = document.querySelector('input[name="documento"]');
            if (campoDoc) {
                campoDoc.maxLength = 11;
                campoDoc.addEventListener("input", function (e) {
                    e.target.value = e.target.value.replace(/\D/g, "").slice(0, 11);
                });
            }

            // 6. Filtro de busca instantânea em qualquer tabela da página
            const tabela = document.querySelector("table");
            if (tabela) {
                const inputBusca = document.createElement("input");
                inputBusca.type = "text";
                inputBusca.className = "form-control mb-3 shadow-sm";
                inputBusca.placeholder = "🔍 Pesquisar na tabela em tempo real...";
                tabela.parentNode.insertBefore(inputBusca, tabela);

                inputBusca.addEventListener("keyup", function () {
                    const termo = inputBusca.value.toLowerCase();
                    tabela.querySelectorAll("tbody tr").forEach(linha => {
                        const textoLinha = linha.textContent.toLowerCase();
                        linha.style.display = textoLinha.includes(termo) ? "" : "none";
                    });
                });
            }

            // 7. Validação visual (bordas vermelhas + mensagem) nos formulários
            document.querySelectorAll("form:not(#form-aviso)").forEach(form => {
                form.setAttribute("novalidate", true);

                // Cria a mensagem de erro abaixo de cada campo obrigatório
                form.querySelectorAll("input[required], select[required], textarea[required]").forEach(campo => {
                    const msgErro = document.createElement("div");
                    msgErro.className = "invalid-feedback";
                    msgErro.textContent = "Este campo é obrigatório.";
                    campo.parentNode.appendChild(msgErro);
                });

                form.addEventListener("submit", function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    form.classList.add("was-validated");
                });
            });
        });
    </script>
</body>
</html>
